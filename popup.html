<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Auto-Fill</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      padding: 15px;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #333;
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 2px solid #eee;
    }

    .tab-btn {
      padding: 8px 12px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #666;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: #0078d4;
      border-bottom-color: #0078d4;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    textarea:focus {
      outline: none;
      border-color: #0078d4;
      box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #0078d4;
      color: white;
    }

    .btn-primary:hover {
      background: #106ebe;
    }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #d0d0d0;
    }

    .status-message {
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }

    .status-message.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .fill-info {
      background: #e7f3ff;
      border: 1px solid #b3d9ff;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      color: #004085;
      margin-bottom: 10px;
    }

    .data-saved {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }

    input[type="file"] {
      padding: 8px;
      border: 1px dashed #0078d4;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .doc-btn-download:hover {
      background: #106ebe !important;
    }

    .doc-btn-delete:hover {
      background: #b71c1c !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Form Auto-Fill</h1>

    <div class="tab-buttons">
      <button class="tab-btn active" data-tab="save">Save Data</button>
      <button class="tab-btn" data-tab="documents">Documents</button>
      <button class="tab-btn" data-tab="fill">Fill Form</button>
    </div>

    <!-- Save Data Tab -->
    <div class="tab-content active" id="save">
      <div class="status-message" id="saveStatus"></div>

      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="e.g., John">
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="e.g., Doe">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="e.g., john@example.com">
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="e.g., +1234567890">
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" placeholder="e.g., 123 Main St, City">
      </div>

      <div class="form-group">
        <label for="country">Country</label>
        <input type="text" id="country" placeholder="e.g., Tunisia">
      </div>

      <div class="form-group">
        <label for="city">City</label>
        <input type="text" id="city" placeholder="e.g., Tunis">
      </div>

      <div class="form-group">
        <label for="zip">Postal Code</label>
        <input type="text" id="zip" placeholder="e.g., 75000">
      </div>

      <div class="form-group">
        <label for="dateOfBirth">Date of Birth</label>
        <input type="text" id="dateOfBirth" placeholder="e.g., 1995-05-15">
      </div>

      <div class="form-group">
        <label for="nationality">Nationality</label>
        <input type="text" id="nationality" placeholder="e.g., Tunisian">
      </div>

      <div class="form-group">
        <label for="currentCompany">Current Company</label>
        <input type="text" id="currentCompany" placeholder="e.g., Acme Corp">
      </div>

      <div class="form-group">
        <label for="currentLocation">Current Location</label>
        <input type="text" id="currentLocation" placeholder="e.g., Paris, France">
      </div>

      <div class="form-group">
        <label for="linkedinUrl">LinkedIn URL</label>
        <input type="text" id="linkedinUrl" placeholder="e.g., linkedin.com/in/yourprofile">
      </div>

      <div class="form-group">
        <label for="githubUrl">GitHub URL</label>
        <input type="text" id="githubUrl" placeholder="e.g., github.com/yourprofile">
      </div>

      <div class="form-group">
        <label for="websiteUrl">Website/Portfolio URL</label>
        <input type="text" id="websiteUrl" placeholder="e.g., yourwebsite.com">
      </div>

      <div class="form-group">
        <label for="graduationYear">Graduation Year</label>
        <input type="text" id="graduationYear" placeholder="e.g., 2024">
      </div>

      <div class="form-group">
        <label for="engineeringSchool">Engineering School</label>
        <input type="text" id="engineeringSchool" placeholder="e.g., Epitech, Supélec">
      </div>

      <div class="form-group">
        <label for="yearsOfExperience">Years of Experience</label>
        <input type="text" id="yearsOfExperience" placeholder="e.g., 3-5, 2, Senior">
      </div>

      <div class="form-group">
        <label for="howHeardAboutUs">How Did You Hear About Us?</label>
        <input type="text" id="howHeardAboutUs" placeholder="e.g., LinkedIn, Referral, Blog">
      </div>

      <div class="form-group">
        <label for="techStacks">Tech Stack Preferences (comma-separated)</label>
        <input type="text" id="techStacks" placeholder="e.g., React, Node, Python">
      </div>

      <div class="form-group">
        <label for="motivationText">What Motivates You?</label>
        <textarea id="motivationText" placeholder="Why do you want to join this company?"></textarea>
      </div>

      <div class="form-group">
        <label for="fitForRoleText">Why Are You Right for This Role?</label>
        <textarea id="fitForRoleText" placeholder="Your strengths and relevant experience..."></textarea>
      </div>

      <div class="form-group">
        <label for="notes">Additional Info</label>
        <textarea id="notes" placeholder="Any other info to auto-fill..."></textarea>
      </div>

      <div class="button-group">
        <button class="btn-primary" id="saveBtn">Save Data</button>
        <button class="btn-secondary" id="clearBtn">Clear All</button>
      </div>

      <div class="data-saved" id="dataSaved"></div>
    </div>

    <!-- Documents Tab -->
    <div class="tab-content" id="documents">
      <div class="status-message" id="docStatus"></div>

      <div class="fill-info">
        Upload documents (CV, transcripts, etc.) to store them locally. You can access them anytime.
      </div>

      <div class="form-group">
        <label for="docUpload">Choose a file (PDF, Word, Image)</label>
        <input type="file" id="docUpload" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.txt">
      </div>

      <div class="form-group">
        <label for="docName">Document name (optional)</label>
        <input type="text" id="docName" placeholder="e.g., My_CV, Transcript">
      </div>

      <button class="btn-primary" id="uploadDocBtn" style="width: 100%; margin-bottom: 15px;">Upload Document</button>

      <div id="documentsList" style="margin-top: 15px;">
        <strong>Stored Documents:</strong>
        <div id="docsContainer" style="margin-top: 10px;"></div>
      </div>
    </div>

    <!-- Fill Form Tab -->
    <div class="tab-content" id="fill">
      <div class="status-message" id="fillStatus"></div>

      <div class="fill-info">
        Go to any form page and click this button to auto-fill with your saved data.
      </div>

      <button class="btn-primary" id="fillBtn" style="width: 100%; margin-bottom: 10px;">Fill Form on This Page</button>

      <div id="fillResults" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
